# Builds AetherVox on GitHub (Windows VST3 + Standalone, macOS VST3/AU) - download from the run's Artifacts.
name: build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: AetherVox-${{ matrix.os }}
          path: |
            build/AetherVox_artefacts/Release/VST3
            build/AetherVox_artefacts/Release/AU
            build/AetherVox_artefacts/Release/Standalone
